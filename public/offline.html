<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9f6" />
    <title>잠시 연결을 기다리는 사이</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; padding: 32px 24px; display: grid; place-items: center; background: #f8f9f6; color: #626657; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
      main { width: min(100%, 360px); }
      .mark { width: 76px; height: 76px; margin: 0 auto 28px; display: grid; place-items: center; color: #9084b2; background: #ece8f2; border-radius: 26px; }
      svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.6; }
      h1 { margin: 0 0 18px; font-size: 24px; font-weight: 550; letter-spacing: -1px; line-height: 1.65; }
      p { margin: 0; color: #989c8a; font-size: 13px; line-height: 1.9; word-break: keep-all; }
      button { margin: 30px 0 22px; min-height: 46px; border: 0; border-radius: 9px; background: #7770b5; color: #fff; font: inherit; font-size: 13px; padding: 12px 26px; cursor: pointer; }
      button:focus-visible { outline: 2px solid #7770b5; outline-offset: 4px; }
      small { display: block; color: #adb09f; font-size: 11px; line-height: 1.9; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 40 40"><ellipse cx="16" cy="20" rx="9" ry="13" transform="rotate(-25 16 20)"/><ellipse cx="24" cy="20" rx="9" ry="13" transform="rotate(25 24 20)"/></svg></div>
      <h1>잠시 연결을<br/>기다리고 있어요.</h1>
      <p>인터넷 연결을 확인해 주세요.<br/>다시 연결되면 이야기를 이어갈 수 있어요.</p>
      <button type="button" onclick="location.reload()">다시 연결하기</button>
      <small>이야기를 읽고 남기려면 인터넷이 필요해요.<br/>연결이 끊기기 전 작성 중이던 글은 저장되지 않을 수 있어요.</small>
    </main>
  </body>
</html>
